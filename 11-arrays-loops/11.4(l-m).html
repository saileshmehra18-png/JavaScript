<!DOCTYPE html>
<html>
    <head>
        <title>practice</title>
    </head>
    <body>
        <script>
            function minMax(array){
                let min = Infinity; 
                let max = -Infinity;

                if (!array.length){
                    max=min=null;
                }

                for (let i = 0; i<array.length;i++){
                    if (array[i]<min){
                        min = array[i]
                    }if (array[i]>max){
                        max = array[i]
                    }    
                }
                return {
                    'max': max,
                    'min': min,
                }
            }
            console.log(minMax([]));
        </script>
    </body>
</html>

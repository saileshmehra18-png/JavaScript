<!DOCTYPE html>
<html>
    <head>
        <title>practice</title>
    </head>
    <body>
        <script>
            function countWords(array){
                const count = {};

                for (let i =0; i<array.length;i++){
                    if (count[array[i]]){
                        count[array[i]]+=1;
                    }else{
                        count[array[i]] = 1;
                    }
                }
                return count ;
            }
            console.log(countWords(['apple', 'grape', 'apple', 'apple']))
        </script>
    </body>
</html>

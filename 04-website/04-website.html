<!DOCTYPE html>
<html>

<head>
    <title>html,css</title>
    <style>
        .red-button {
            background-color: red;
            color: white;
        }

        .yellow-button {
            background-color: yellow;
            color: black;
        }
    </style>
</head>

<body>
    <button title="Good job" class='red-button' onclick="alert('Good job')">
        hello
    </button>
    <p>
        paragraph of <button class="yellow-button">
            hello
        </button>
        text
    </p>
    <!--this will pop us a alert msg whhenever we load the page and the above oneclick is for whenever we click that button-->
    <script>
        alert('hello');
        console.log(2+2);
    </script> 
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
    </head>
    <body>
        <p> Rock Paper Scissors </p>
        <button onclick="
            playGame('Rock');
        "> Rock</button>

        <button onclick="
            playGame('Paper');
        ">Paper</button>

        <button onclick="
            playGame('Scisors');    
        ">Scisors</button>
        
        <script>
            
        function pickComputerMove(){
            const randomnumber = Math.random();
            
            let computermove ='';

            if (randomnumber>=0 && randomnumber<1/3){
                computermove = 'Rock'
            }else if (randomnumber>=1/3 && randomnumber<2/3){
                computermove = 'Paper'
            } else{
                computermove = 'Scissors'
            }

            return computermove;
        }
        function playGame(playerMove){
            const computermove = pickComputerMove();
            
            let result = '';
            if (playerMove ==='Scisors') {
                 if (computermove === 'Rock'){
                    result = 'You loose';
                } else if (computermove === 'Paper'){
                    result = 'You Win';
                } else{
                    result = 'Tie';
            }
            } else if (playerMove ==='Rock') {
                 if (computermove === 'Rock'){
                result = 'Tie';
                } else if (computermove === 'Paper'){
                    result = 'You lose';
                } else{
                    result = 'You win';
                }
            }else {
                 if (computermove === 'Rock'){
                    result = 'You Win';
                } else if (computermove === 'Paper'){
                    result = 'Tie';
                } else{
                    result = 'You loose';
                }
            }
            alert(`You choose ${playerMove}. and the computer chose ${computermove}. ${result}`);
        }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <link rel="stylesheet" href="../styles/dom-project.css">
</head>

<body>
    <div class="page">
        <section class="section">
            <h2 class="section-title">YouTube Subscribe Button</h2>
            <button class="subscribe-btn js-subscribe-button" onclick="subscribe()">Subscribe</button>
        </section>

        <section class="section">
            <h2 class="section-title">Amazon Shipping Calculator</h2>
            <p class="shipping-note">Orders under $40 = +$10 shipping.</p>
            <p class="shipping-note">Orders over $40 = FREE shipping.</p>

            <div class="shipping-row">
                <input class="input-box" type="text" placeholder="Cost of order" onkeydown="handleEnter(event)">
                <button class="calculate-btn" onclick="calculateTotal()">Calculate</button>
            </div>
            <div class="total-cost js-total-cost"></div>
        </section>

        <section class="section">
            <h2 class="section-title">Rock Paper Scissors</h2>
            <a class="rps-link" href="#">Click here</a>
        </section>
    </div>

    <script>
        function handleEnter(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal() {
            const input = document.querySelector('.input-box');
            const totalElement = document.querySelector('.js-total-cost');
            let total = Number(input.value);

            if (total < 40) {
                total += 10;
            }

            totalElement.textContent = `$${total}`;
        }

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerText = 'Subscribed';
                buttonElement.classList.add('is-subscribed');
            } else {
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('is-subscribed');
            }
        }
    </script>
</body>

</html>

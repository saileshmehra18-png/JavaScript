<!DOCTYPE html>
<html>
    <head>
        <title>practice</title>
    </head>
    <body>
        <button onclick="
            showInput('Heads');
        ">Heads</button>
        <button onclick="
            showInput('Tails');
        ">Tails</button>
        <p class="js-output"></p>

            function showInput(input){
                document.querySelector('.js-output').innerHTML = `Input: ${input}`
            }
        </script>
    </body>
</html>

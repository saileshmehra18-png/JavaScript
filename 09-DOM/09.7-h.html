<!DOCTYPE html>
<html>
    <head>
        <title>practice</title>
    </head>
    <body>
        <input placeholder='Type' class="js-input" onkeyup="
            showInput();
            ">
        <p class="js-output"></p>
        <script>
            function showInput(){
                const inputValue = document.querySelector('.js-input').value;
                document.querySelector('.js-output').innerHTML = inputValue;
            }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
</head>

<body>

    <p> Rock Paper Scissors </p>
    <button onclick="
            playGame('Rock');
        "> Rock</button>

    <button onclick="
            playGame('Paper');
        ">Paper</button>

    <button onclick="
            playGame('Scissors');    
        ">Scissors</button>

    <p class="js-result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>
    

    <button onclick="
            score.wins=0;
            score.losses=0;
            score.ties=0;
            localStorage.removeItem('score');
            updateScoreElement();
            ">Resset Score</button>

<script>
    //converted the json string back to js code to assign in a variable
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0,
        }
        

        function updateScoreElement() {
            document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }

        updateScoreElement(); //this one to show the score when page loads

        function pickComputerMove() {
            const randomnumber = Math.random();
            
            let computermove = '';
            
            if (randomnumber >= 0 && randomnumber < 1 / 3) {
                computermove = 'Rock'
            } else if (randomnumber >= 1 / 3 &&             randomnumber < 2 / 3) {
                computermove = 'Paper'
            } else {
                computermove = 'Scissors'
            }

            return computermove;
        }
        function playGame(playerMove) {
            const computermove = pickComputerMove();

            let result = '';
            if (playerMove === 'Scissors') {
                if (computermove === 'Rock') {
                    result = 'You lose';
                } else if (computermove === 'Paper') {
                    result = 'You win';
                } else {
                    result = 'Tie';
                }
            } else if (playerMove === 'Rock') {
                if (computermove === 'Rock') {
                    result = 'Tie';
                } else if (computermove === 'Paper') {
                    result = 'You lose';
                } else {
                    result = 'You win';
                }
            } else {
                if (computermove === 'Rock') {
                    result = 'You win';
                } else if (computermove === 'Paper') {
                    result = 'Tie';
                } else {
                    result = 'You lose';
                }
            }

            if (result === "You win") {
                score.wins += 1;
            } else if (result === "You lose") {
                score.losses += 1;
            } else {
                score.ties += 1
            }

            localStorage.setItem('score', JSON.stringify(score)); //converting in json to save in local storage

            
            updateScoreElement(); //this one to update the scores
            document.querySelector('.js-result').innerHTML
                = result;

            document.querySelector('.js-move').innerHTML
            = `your ${playerMove} comp ${computermove}`

            alert(`You choose ${ playerMove }. and the computer chose ${ computermove }. ${ result }
        wins:${ score.wins } , losses:${ score.losses } , ties:${ score.ties }`);
        }

    </script>
</body>

</html>

<!DOCTYPE html>
<html>
    <head>
        <title>A-B</title>
    </head>
    <body>
        <script>
            const add = function(){
                console.log(2+3);
            }
            add();
            add();

            //B

            function runTwice(fun){
                fun();
                fun();
            }
            runTwice(function(){
                console.log('meoww');
            });
            runTwice(add);
            </script>
    </body>
</html>

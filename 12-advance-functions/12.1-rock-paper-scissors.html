<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="../styles/12.1-rock-paper-scissors.css">
</head>

<body>

    <p class="title"> Rock Paper Scissors </p>
    <button class="move-button  js-rock-button">
        <img src="../images/rock-emoji.png" alt="Rock" width="50">
    </button>

    <button class="move-button  js-paper-button" >
        <img src="../images/paper-emoji.png" alt="Paper" width="50">
    </button>

    <button class="move-button  js-scissors-button" >
        <img src="../images/scissors-emoji.png" alt="Scissors" width="50">
    </button>

    <p class="js-result result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>


    <button class="js-resset">Resset Score</button>

    <button class="auto-play-button" >Auto Play</button>

    <p class="js-resset-confirmation"></p>

    <script src="../scripts/12.1-rock-paper-scisor.js"></script>
</body>

</html>

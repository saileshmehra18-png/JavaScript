<!DOCTYPE html>
<html>

        <title><J-L></J-L></title>
    </head>
    <body>
        <script>
            // j-k
            const multiply = (a,b) => a*b           
            console.log(multiply(2,4))

            // L
            function countPositive(arr){

                let count = 0
                arr.forEach((value,index) => {
                    if (value>=0){
                        count +=1
                    }
                });
                return count
            }
            console.log(countPositive([0.3,-523,44,-0]));
        </script>

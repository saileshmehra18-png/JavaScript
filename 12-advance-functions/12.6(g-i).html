<!DOCTYPE html>
<html>
    <head>
        <title class="js-title">App</title>
    </head>
    <body>

        <button class="js-add-button" >Add</button>
        
        <button class="js-remove-button">Remove</button>

        <script>
            let message = 0;
            let intervalId;
            let isplaying=false;

            displayFunction();
            function displayFunction (){
                intervalId = setInterval(() => {   
                    if (message === 0) {
                        stopChanging();
                    }else{
                        if (document.title === 'App') {
                            document.title = `(${message} New messages)`;
                        } else {
                            document.title = 'App'
                        }                      
                        isplaying=true;
                    }  
            },1000);}

            document.querySelector('.js-add-button').addEventListener('click', ()=>{
                updateMessage('Add')
            })

            document.querySelector('.js-remove-button').addEventListener('click', ()=>{
                updateMessage('Remove')
            })

            function updateMessage(button){
                
                if (button==='Add'){
                    message+=1
                    if(!isplaying){
                        displayFunction();
                    }     
                }
                else{
                    if(message>0){
                        message -= 1;
                        if (!isplaying) {
                            displayFunction();
                        }
                    }
                    
                }
            }
            function stopChanging(){
                clearInterval(intervalId);
                document.title = 'App';
                isplaying =false;
            }
        </script>
    </body>
</html>

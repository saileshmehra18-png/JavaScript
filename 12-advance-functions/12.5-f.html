<!DOCTYPE html>
<html>

<head>
    <title>F</title>
</head>

<body>

    <button class="js-add-to-cart" onclick="
         displayMessage();
         ">Add to Cart</button>

    <p class="js-message"></p>

    <script>
        //E
        let TimerId;
        let isRunning = false;
        function displayMessage() {
            if (!isRunning){
                const messageElement = document.querySelector('.js-message');
                messageElement.innerHTML = 'Added';

                TimerId = setTimeout(function () {
                    messageElement.innerHTML = '';
                }, 2000);
                isRunning= true;
            } else{
                clearTimeout(TimerId);
                isRunning = false;
                displayMessage();
            }
            
        }


    </script>
</body>

</html>

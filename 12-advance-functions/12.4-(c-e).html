<!DOCTYPE html>
<html>
    <head>
        <title>C</title>
    </head>
    <body>
        <button class="js-start-button" onclick="
            changeHtml();
        ">Start</button>

        <button class="js-add-to-cart" onclick="
         displayMessage();
         ">Add to Cart</button>

         <p class="js-message"></p>

        <script>

            //C-D
            function changeHtml(){
                setInterval(function () {
                    document.querySelector('.js-start-button').innerHTML = 'Finished'
                }, 1000)
                document.querySelector('.js-start-button').innerHTML = 'Loading...'
            }
            
            //E
            function displayMessage() {
                    const messageElement = document.querySelector('.js-message');
                    messageElement.innerHTML = 'Added';

                    setTimeout(function () {
                        messageElement.innerHTML = '';
                    }, 2000);
                }

        </script>
    </body>
</html>
